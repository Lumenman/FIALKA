; Подготовка текста — то, что на настоящей машине делал оператор до того, как
; сесть за клавиатуру. Применяется только по ключу --prepare и только к
; открытому тексту; без ключа чужой знак — отказ.
;
; Таблиц две. [abbreviate] — сокращения, идут первыми и по всему тексту.
; [replace] — замены, идут вторыми и только для того, что не набирается.
;
; Заменяется лишь то, что в выбранном режиме набрать нельзя. В смешанном
; (--mode M) цифры, пунктуация и Ъ, Э, Й идут на машину как есть, и таблица
; для них не срабатывает; в буквенном (--mode L) — срабатывает.
;
; Принцип взят из мануала (Fialka_200.pdf, гл. 3.2.1): реализованы 30 самых
; частых знаков, а «numbers, punctuation marks, etc. were simply omitted…
; replaced by a specific sequence or fully written out».
;
; САМА ТАБЛИЦА В МАНУАЛЕ НЕ ПРИВЕДЕНА. Это наше соглашение по советской
; телеграфной практике, а не реконструкция. Правьте под свою сеть: файл
; читается при каждом запуске.
;
; Регистр приводится к прописным всегда и до этой таблицы, поэтому строчных
; здесь нет. Точка с запятой и знак равенства ключом прямо не записываются:
; ';' начинает комментарий, '=' делит строку. Для них те же токены, что на
; печатающей головке: '\s' и '\e'.
;
; Цифр здесь нет намеренно: у M-125-3 для них есть смешанный режим и режим
; цифр, и суррогат прописью закрепил бы соглашение конкретной сети связи,
; а не свойство машины. Цифра в буквенном режиме — отказ с подсказкой про
; --mode M. Если ваша сеть писала числа словами, раскомментируйте:
;
; 0 = НОЛЬ
; 1 = ОДИН
; 2 = ДВА
; 3 = ТРИ
; 4 = ЧЕТЫРЕ
; 5 = ПЯТЬ
; 6 = ШЕСТЬ
; 7 = СЕМЬ
; 8 = ВОСЕМЬ
; 9 = ДЕВЯТЬ

; Сокращения. Пустая таблица ничего не меняет, и так оно по умолчанию:
; сокращать МИНУТ до МИН — соглашение конкретной сети связи, а не свойство
; машины, и в мануале такой таблицы нет. Отличие от [replace] ниже в том, что
; здесь заменяется не «ненабираемое», а любое совпадение: МИНУТ набирается
; прекрасно, сокращают его не поэтому. Ключ может быть любой длины; на каждом
; месте берётся самое длинное подошедшее, поэтому порядок строк ни на что не
; влияет. Сокращения необратимы — получатель прочтёт МИН, а не МИНУТ, — и
; каждое из них печатается в отчёт подготовки, как и замены.
;
; МИНУТ = МИН
; ЧАСОВ = ЧАС
; ГРАДУСОВ = ГРАД
; КООРДИНАТЫ = КООРД
[abbreviate]

[replace]
; трёх букв из 33 на машине физически нет
Ё = Е
Ъ = Ь
Э = Е
; Й набрать нельзя: её клавиша занята пробелом (мануал, гл. 4.5)
Й = И
; знаки препинания — словом
. = ТЧК
, = ЗПТ
: = ДВТ
- = ТИРЕ
" = КВЧ
\s = ТЧКЗПТ
\e = РАВНО
