; Подготовка текста — замены, которые на настоящей машине делал оператор
; до того, как сесть за клавиатуру. Применяются только по ключу --prepare
; и только к открытому тексту; без ключа чужой знак — отказ.
;
; Принцип взят из мануала (Fialka_200.pdf, гл. 3.2.1): реализованы 30 самых
; частых знаков, а «numbers, punctuation marks, etc. were simply omitted…
; replaced by a specific sequence or fully written out».
;
; САМА ТАБЛИЦА В МАНУАЛЕ НЕ ПРИВЕДЕНА. Это наше соглашение по советской
; телеграфной практике, а не реконструкция. Правьте под свою сеть: файл
; читается при каждом запуске.
;
; Регистр приводится к прописным всегда и до этой таблицы, поэтому строчных
; здесь нет. Ключами не могут быть знаки ';' и '=' — их съедает формат INI.
;
; Цифр здесь нет намеренно. У M-125-3 для них есть смешанный режим и режим
; только цифр; они пока не реализованы, и суррогат прописью закрепил бы
; неправильное. Цифра во входе — отказ.

[replace]
; трёх букв из 33 на машине физически нет
Ё = Е
Ъ = Ь
Э = Е
; Й набрать нельзя: её клавиша занята пробелом (мануал, гл. 4.5)
Й = И
; знаки препинания — словом
. = ТЧК
, = ЗПТ
