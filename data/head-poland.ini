; Печатающая головка М-125-3, польская латиница. Извлечена из плагина
; CrypTool 2 (CrypTool.Fialka, keyboardPolandLet и keyboardPolandSpec) —
; это второй источник помимо симулятора, см. docs/mechanism.md.
;
; Подключается ключом: fialka -H ../data/head-poland.ini
;
; Латиница даёт 26 букв на тридцать контактов, и четыре лишних отданы цифрам:
; 5 на 7, 7 на 20, 8 на 28 и 2 на 30. Три из них стоят на служебных клавишах
; (БК, ЦФ и пробел) и потому не набираются вовсе — ровно как Ж, Ф и Й на
; кириллице. Цифра 8 стоит на живой клавише 28 и при этом есть в верхнем ряду
; на 25: на этой головке её можно набрать двумя клавишами, и контакты, а
; значит и шифртекст, получатся разные. На кириллической головке такого нет.
;
; РЕЖИМ ЦИФР (рычаг Ц) с этой головкой не работает и работать не должен:
; десять клавиш отпирает проводка машины (keyboard.10 и парная ей таблица
; возврата alt_decoding), а не головка, и у нас извлечена только советская.
; Цифры этой головки стоят на контактах 4 6 8 10 13 19 21 22 24 25, а
; советская проводка отпирает 1 2 4 13 15 16 18 19 21 24 — совпадают пять.
; Проводки польской клавиатуры у нас нет, вывести её неоткуда. В буквенном и
; смешанном режимах головка работает: там живы все тридцать контактов.

[head]
id    = poland
lower = F A D U L T 5 P B R K V Z J G H C N E 7 Q W X I O S M 8 Y 2
upper = Ą % - 6 ) 4 БК 9 ? 3 ( = 5 + Ę Ł : , 2 ЦФ 0 1 / 7 8 Ž . ° ' ~
