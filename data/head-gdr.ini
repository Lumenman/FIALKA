; Печатающая головка М-125 MN/3MN, латиница ГДР.
;
; ВОССТАНОВЛЕНА, А НЕ СНЯТА НАПРЯМУЮ. Источник — таблица типового колеса
; «Typenrad M-125 MN deutsch» с scz.bplaced.net/m125.html. Колесо там дано в
; физическом порядке позиций, а не по контактам; перестановка «позиция колеса
; -> контакт» выведена из кириллического колеса на той же странице и проверена
; на польско-чехословацком: под ней его колесо даёт строку плагина CrypTool 2
; знак в знак. Разбор — в docs/mechanism.md.
;
; Головку ГДР из плагина мы не берём: под той же перестановкой она не сходится
; с колесом, и сама по себе противоречива — буква A стоит у неё на контакте 20,
; под клавишей ЦФ, а в верхнем ряду её нет, то есть A набрать нечем.
; Восстановленная противоречия не имеет.
;
; Латиница ГДР короче прочих: букв в нижнем ряду только 22, Q W X Y вытеснены
; наверх, а освободившиеся контакты отданы цифрам. На служебных контактах
; 7, 20 и 30 (БК, ЦФ, пробел) стоят V, F и J — и все три нашлись в верхнем
; ряду, ровно как Ж, Ф и Й на кириллице.
;
; РЕЖИМ ЦИФР (рычаг Ц) не работает, как и с прочими латинскими головками:
; десять клавиш отпирает проводка машины, а не головка, и у нас извлечена
; только советская. Цифры этой головки стоят на контактах 3 6 8 9 14 15 16 18
; 19 24, советская проводка отпирает 1 2 4 13 15 16 18 19 21 24 — совпадают
; пять. В буквенном и смешанном режимах головка работает.
;
; Знак · на контакте 12 — точка по центру строки, как на колесе.

