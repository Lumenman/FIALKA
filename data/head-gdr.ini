lower = A B 2 G D E V Z I K L M N O P R S T U F H C 8 3 5 6 7 9 4 J
upper = Q / 1 Ä V 2 БК 5 7 ( ) · , 8 9 3 W 4 6 ЦФ Ü X : 0 Ö F Y - J ~
