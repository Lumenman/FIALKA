; Печатающая головка М-125-3, чехословацкая латиница. Извлечена из плагина
; CrypTool 2 (CrypTool.Fialka, keyboardCzechoslovakianLet и
; keyboardCzechoslovakianSpec) — см. docs/mechanism.md.
;
; Подключается ключом: fialka -H ../data/head-czechoslovakia.ini
;
; Нижний ряд тот же, что у польской головки: в плагине это буквально одна и
; та же строка. Различаются головки только верхним рядом — диакритикой.
;
; РЕЖИМ ЦИФР (рычаг Ц) с этой головкой не работает: см. head-poland.ini, там
; то же самое и с теми же контактами. В буквенном и смешанном работает.

[head]
id    = czechoslovakia
lower = F A D U L T 5 P B R K V Z J G H C N E 7 Q W X I O S M 8 Y 2
upper = Ř Ä Č 6 Ě 4 БК 9 " 3 Ö = 5 Ü Ž + : , 2 ЦФ 0 1 / 7 8 Š . % - ~
