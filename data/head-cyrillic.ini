; Печатающая головка М-125-3, кириллица. Выбирается строкой script в файле
; машины: script = cyrillic ищет head-cyrillic.ini рядом с ним. Ключом -H
; можно подставить любой другой файл.
;
; Головка — единственная часть машины, которую можно менять, не трогая шифр:
; диски, рефлектор и входной диск работают с номерами контактов и букв не
; знают. Знаки входят в расчёт только на клавиатуре и на печати, то есть
; ровно здесь.
;
; Нижний ряд — тридцать букв, по одной на контакт 1..30. Он же раскладка
; клавиатуры: место буквы в строке и есть номер её контакта. В бинарнике
; симулятора кириллица лежит пятью одинаковыми копиями, без цифр.
;
; Верхний ряд (мануал 3.4.8) — токен на контакт: цифры, знаки препинания и
; три буквы, вытесненные из нижнего ряда. Читается в смешанном режиме после
; ЦФ и в режиме цифр. Прочитан с клавиатуры симулятора и сверен с рисунком
; головки в мануале. Два токена особые: '~' — знака на этом контакте нет,
; '\s' — точка с запятой (её вырезает питоновский читатель эталона,
; reference/fialka.py). ЦФ и БК — переключатели регистра, а не знаки:
; через шифратор идут как все, но не печатаются.
;
; Три контакта заняты служебным, и стоявшие на них буквы переехали наверх
; (мануал 3.2.10): 7 — БК, там была Ж; 20 — ЦФ, там была Ф; 30 делит клавишу
; с пробелом, там Й. Номера этих контактов задаёт файл машины, а не головка:
; это проводка клавиатуры, она от письменности не зависит.
;
; Из русских 33 на машине нет Ё, Ъ и Э; Ъ и Э добраны верхним рядом, Ё
; заменяется по data/prepare.ini.

[head]
id    = cyrillic
lower = А Б В Г Д Е Ж З И К Л М Н О П Р С Т У Ф Х Ц Ч Ш Щ Ы Ь Ю Я Й
upper = 5 8 - 3 Ж , БК + Й N % . 4 ° 9 7 Ъ 6 2 ЦФ 0 : " 1 = Ф / Э \s ~
