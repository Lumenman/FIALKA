; Ключ с перфокарты demo/kt16_08_26.txt (16.08.26), комплект 6K.
; Значения можно писать буквами алфавита или числами 1..30 — как на карте.
;
; Проверено: этот ключ воспроизводит demo/de.txt -> demo/en.txt знак в знак.
;
; На карте пять строк, а машине нужно шесть массивов. Шестой — стартовая
; позиция, это буквы, видимые в прорези барабана; программа выставляет их
; равными строке 1 (FUN_00469aec, режим 0: position[i] = wheel_order[i]).

[key]
mode = coding          ; coding | decoding | plain
live = 30              ; из M125.INI: Module=30, B-S-C=1 (буквы)

; строка 1 карты — порядок дисков (ободов) по слотам
wheel_order = Ж Е Б А И Г Д К В З

; строка 2 карты
ring        = Ь Г П У Ц Ф Ш О Ь Ы

; строка 3 карты — порядок сердечников по слотам
core_order  = И Д Б В А З Е К Г Ж

; строка 4 карты — сторона сердечника
core_side   = 2 1 2 1 2 1 1 1 1 2

; строка 5 карты — смещение сердечника относительно обода
core_offset = Д Б Е Н К Ц Ы Ф Б К

; шестой ряд: буквы в прорези барабана, здесь совпадают со строкой 1
position    = Ж Е Б А И Г Д К В З

; перфокарта: identity | builtin | 30 чисел
card = identity
